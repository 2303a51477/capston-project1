<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gradSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Decorative Circles -->
  <circle cx="300" cy="225" r="190" fill="url(#gradBg)" opacity="0.7"/>
  <circle cx="480" cy="110" r="45" fill="#bae6fd" opacity="0.4"/>
  <circle cx="110" cy="330" r="30" fill="#bae6fd" opacity="0.3"/>

  <!-- Floating Holographic Data Card 1: Attendance Gauge (Left) -->
  <g filter="url(#shadow)" transform="translate(40, 90)">
    <rect width="170" height="110" rx="14" fill="url(#gradCard)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="35" cy="32" r="14" fill="#dcfce7"/>
    <path d="M30 32 L34 36 L40 28" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="29" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Attendance</text>
    <text x="56" y="42" font-family="sans-serif" font-size="9" fill="#64748b">Verified Safe</text>
    <text x="24" y="82" font-family="sans-serif" font-size="24" font-weight="bold" fill="#15803d">88.5%</text>
    <!-- Progress bar -->
    <rect x="24" y="92" width="122" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="24" y="92" width="108" height="6" rx="3" fill="#16a34a"/>
  </g>

  <!-- Floating Holographic Data Card 2: AI Predicted Score (Right) -->
  <g filter="url(#shadow)" transform="translate(390, 70)">
    <rect width="180" height="120" rx="14" fill="url(#gradCard)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="36" cy="35" r="14" fill="#e0f2fe"/>
    <polygon points="36,25 43,39 29,39" fill="#0284c7"/>
    <text x="58" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">AI Prediction</text>
    <text x="58" y="44" font-family="sans-serif" font-size="9" fill="#0284c7">Random Forest</text>
    <text x="24" y="84" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0284c7">86.4<tspan font-size="13" fill="#64748b"> /100</tspan></text>
    <rect x="24" y="92" width="80" height="18" rx="9" fill="#dcfce7"/>
    <text x="35" y="105" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d">EXCELLENT</text>
  </g>

  <!-- Desk & Computer Base -->
  <path d="M120 380 L480 380 L460 395 L140 395 Z" fill="#cbd5e1"/>
  <rect x="100" y="375" width="400" height="10" rx="4" fill="#94a3b8"/>

  <!-- Laptop / Screen -->
  <g filter="url(#shadow)" transform="translate(210, 240)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="180" height="115" rx="8" fill="#1e293b"/>
    <!-- Display -->
    <rect x="6" y="6" width="168" height="103" rx="4" fill="#ffffff"/>
    <!-- Mini Charts on Laptop -->
    <rect x="14" y="14" width="42" height="16" rx="3" fill="#e0f2fe"/>
    <rect x="18" y="22" width="20" height="3" fill="#0284c7"/>
    <!-- Mini Bar Chart -->
    <rect x="14" y="45" width="10" height="35" rx="2" fill="#38bdf8"/>
    <rect x="28" y="35" width="10" height="45" rx="2" fill="#0284c7"/>
    <rect x="42" y="55" width="10" height="25" rx="2" fill="#0369a1"/>
    <rect x="56" y="30" width="10" height="50" rx="2" fill="#16a34a"/>
    <line x1="10" y1="83" x2="70" y2="83" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Line chart graphic -->
    <path d="M85 70 Q 105 45, 125 55 T 160 30" fill="none" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="85" cy="70" r="3" fill="#0284c7"/>
    <circle cx="125" cy="55" r="3" fill="#0284c7"/>
    <circle cx="160" cy="30" r="3.5" fill="#16a34a"/>
    <!-- Laptop Base -->
    <path d="M-15 115 L195 115 L180 125 L0 125 Z" fill="#94a3b8"/>
  </g>

  <!-- Student Character (Side-Angle Focused on Studying) -->
  <g transform="translate(140, 190)">
    <!-- Body / Jacket -->
    <path d="M40 185 C40 135, 75 125, 95 125 C115 125, 140 135, 140 185 Z" fill="#0284c7"/>
    <!-- Collar -->
    <polygon points="90,125 95,142 100,125" fill="#ffffff"/>
    <polygon points="80,125 95,145 110,125" fill="#e0f2fe"/>
    <!-- Arms reaching to laptop keyboard -->
    <path d="M50 148 C65 155, 95 160, 125 155" stroke="#0369a1" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Neck -->
    <rect x="88" y="105" width="14" height="22" rx="4" fill="#fed7aa"/>
    <!-- Head -->
    <circle cx="95" cy="85" r="24" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M72 82 C72 65, 85 58, 102 58 C115 58, 122 68, 120 80 C112 75, 95 72, 85 82 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="94" y="80" width="15" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="88" y1="85" x2="94" y2="85" stroke="#0f172a" stroke-width="2"/>
    <!-- Eye & smile -->
    <circle cx="102" cy="85" r="1.5" fill="#0f172a"/>
    <path d="M96 95 Q 101 99, 107 95" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Graduation Cap Floating with Success Sparkles -->
  <g transform="translate(260, 45)">
    <polygon points="40,25 80,10 40,-5 0,10" fill="#0f172a"/>
    <rect x="25" y="24" width="30" height="12" rx="4" fill="#1e293b"/>
    <line x1="40" y1="10" x2="72" y2="28" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="72" cy="28" r="3" fill="#f59e0b"/>
    <!-- Sparkles -->
    <path d="M-8 12 L-4 12 M-6 10 L-6 14" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M90 5 L94 5 M92 3 L92 7" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Books Stack on Right Desk -->
  <g transform="translate(420, 310)">
    <rect x="0" y="50" width="65" height="15" rx="3" fill="#38bdf8"/>
    <rect x="5" y="36" width="60" height="14" rx="3" fill="#0284c7"/>
    <rect x="2" y="22" width="58" height="14" rx="3" fill="#1e293b"/>
    <line x1="12" y1="22" x2="12" y2="65" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>

  <!-- Plant on Left Desk -->
  <g transform="translate(130, 315)">
    <path d="M10 40 L28 40 L24 60 L14 60 Z" fill="#94a3b8"/>
    <path d="M19 40 Q 5 20, 10 10 Q 25 22, 19 40 Z" fill="#16a34a"/>
    <path d="M19 40 Q 30 18, 32 8 Q 38 24, 19 40 Z" fill="#22c55e"/>
  </g>
</svg>

